name: macOS Build

on:
  push:
    branches:
      - master
      - "codex/**"
      - "fix/**"
    paths:
      - ".github/workflows/macos-build.yml"
      - "Maccy/**"
      - "Maccy.xcodeproj/**"
      - "MaccyTests/**"
      - "MaccyUITests/**"
  pull_request:
    paths:
      - ".github/workflows/macos-build.yml"
      - "Maccy/**"
      - "Maccy.xcodeproj/**"
      - "MaccyTests/**"
      - "MaccyUITests/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build Maccy
        run: |
          xcodebuild \
            -project Maccy.xcodeproj \
            -scheme Maccy \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package Maccy.app
        run: |
          APP_PATH="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Debug/Maccy.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "Unable to find built Maccy.app" >&2
            exit 1
          fi

          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/Maccy-${{ github.run_number }}.zip"

      - name: Upload Maccy artifact
        uses: actions/upload-artifact@v4
        with:
          name: Maccy-app-${{ github.run_number }}
          path: dist/Maccy-${{ github.run_number }}.zip
          if-no-files-found: error
